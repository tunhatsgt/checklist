<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ visa Schengen</title>
<style>
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#f6f7f4;color:#1f2a37}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #1f2a37;background:#fff;padding:6px 12px;border-radius:6px}
button.p{background:#6d28d9;color:#fff;border-color:#6d28d9}
#login{max-width:320px;margin:15vh auto;display:grid;gap:10px}input,select,textarea{padding:7px;border:1px solid #b8bcb0;border-radius:6px;box-sizing:border-box}
#app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #d9dcd3;padding:16px}main{padding:20px 28px;overflow:auto}
.cu{padding:8px;border-radius:6px;cursor:pointer}.cu:hover,.cu.on{background:#f1eafb}.m{color:#6b7280;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:8px;border-bottom:1px solid #d9dcd3;text-align:left;vertical-align:top}
tr.s td{background:#e6f4f1;font-weight:700}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.f a{display:inline-block;margin-right:8px}@media(max-width:800px){#app{grid-template-columns:1fr}.g{grid-template-columns:1fr 1fr}}
</style></head><body>
<form id="login" hidden><h2>Đăng nhập</h2><input name="u" placeholder="Tài khoản" required><input name="p" type="password" placeholder="Mật khẩu" required><button class="p">Vào</button><div id="err" style="color:#b91c1c"></div></form>
<div id="app" hidden><aside><b id="who"></b> <button onclick="out()">Thoát</button><hr>
<button class="p" id="add" onclick="addC()">+ Khách mới</button> <a href="/api/export.csv">Xuất CSV</a><div id="list"></div><button id="adminBtn" onclick="users()" hidden>Quản lý user</button></aside><main id="main"><p class="m">Chọn hoặc tạo khách ở bên trái.</p></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,cur,list=[];const ST={'':'—',ok:'Đủ',missing:'Thiếu',extra:'Bổ sung'};
const api=async(u,o={})=>{const f=o.body instanceof FormData;const r=await fetch(u,{method:o.method,headers:o.body&&!f?{'Content-Type':'application/json'}:{},body:f?o.body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const own=i=>me.role==='admin'||me.role===(i<=16?'sale':'op'),upl=i=>own(i)||me.role==='visa',stt=()=>['admin','visa'].includes(me.role);
async function init(){try{me=await api("/api/me");window.ITEMS=me.items;$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=me.username+' ('+me.role+')';$('#adminBtn').hidden=me.role!=='admin';$('#add').hidden=!['admin','sale'].includes(me.role);load()}catch{$('#login').hidden=false;$('#app').hidden=true}}
$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:{username:e.target.u.value,password:e.target.p.value}});init()}catch(x){$('#err').textContent=x.message}};
const out=async()=>{await api('/api/logout',{method:'POST'});init()};
async function load(){list=await api('/api/customers');$('#list').innerHTML=list.map(c=>`<div class="cu ${cur?.id===c.id?'on':''}" onclick="open_('${c.id}')"><b>${esc(c.name)}</b><div class="m">${esc(c.country)} · ${c.done}/23 đủ · ${c.files} file</div></div>`).join('')}
async function addC(){const n=prompt('Tên khách / đoàn');if(n){const c=await api('/api/customers',{method:'POST',body:{name:n}});await load();open_(c.id)}}
async function open_(id){cur=await api('/api/customers/'+id);draw();load()}
function draw(){const c=cur,I=window.ITEMS;const sec={1:'A · Sale – hồ sơ cá nhân',11:'B · Sale – công ty bảo lãnh, tổ chức chuyến đi',17:'C · Điều hành – hành trình'};
 const ro=!['admin','sale'].includes(me.role),vo=!stt();
 let h=`<h2>${esc(c.name)}</h2><div class="g"><label>Tên<input id="name" value="${esc(c.name)}" ${ro?'disabled':''}></label><label>Nước nộp<input id="country" value="${esc(c.country)}" ${ro?'disabled':''}></label><label>Ngày dự kiến nộp<input id="date" type="date" value="${esc(c.date)}" ${ro?'disabled':''}></label><label>Ghi chú<input id="note" value="${esc(c.note)}" ${ro?'disabled':''}></label></div><table><tr><th>#</th><th>Hạng mục</th><th>Đã thu</th><th>Visa kiểm tra</th><th>File scan</th></tr>`;
 I.forEach((nm,k)=>{const i=k+1,o=c.checks[i]||{};if(sec[i])h+=`<tr class="s"><td colspan="5">${sec[i]}</td></tr>`;
  const fs=c.files.filter(f=>f.item===i).map(f=>`<span class="f"><a href="/api/customers/${c.id}/files/${f.id}">${esc(f.name)}</a>${me.role==='admin'||f.by===me.username?`<a href="#" onclick="del('${f.id}');return false">×</a>`:''}</span>`).join('');
  h+=`<tr><td>${i}</td><td>${esc(nm)}</td><td><input type="checkbox" id="c${i}" ${o.collected?'checked':''} ${own(i)?'':'disabled'}></td><td><select id="s${i}" ${vo?'disabled':''}>${Object.entries(ST).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td>${fs}${upl(i)?`<br><input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onchange="upload(${i},this)">`:''}</td></tr>`});
 h+=`</table><div class="g" style="grid-template-columns:2fr 1fr"><label>Danh sách thiếu / yêu cầu bổ sung<textarea id="missing" rows="3" ${vo?'disabled':''}>${esc(c.missing)}</textarea></label><label>Kết luận<select id="conclusion" ${vo?'disabled':''}>${['','Đủ hồ sơ – sẵn sàng nộp','Thiếu hồ sơ – chờ bổ sung','Cần bổ sung theo yêu cầu lãnh sự'].map(v=>`<option ${c.conclusion===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
 <button class="p" onclick="saveC()">Lưu</button> <a href="/api/customers/${c.id}" download="${c.id}.json">Tải JSON</a> ${me.role==='admin'?`<button onclick="delC()">Xóa khách</button>`:''} <span class="m">${c.updatedBy?'Cập nhật bởi '+esc(c.updatedBy)+' '+new Date(c.updatedAt).toLocaleString('vi-VN'):''}</span>`;
 $('#main').innerHTML=h}
async function saveC(){const b={checks:{}};for(const k of['name','country','date','note','missing','conclusion'])b[k]=$('#'+k).value;
 window.ITEMS.forEach((_,k)=>{const i=k+1;b.checks[i]={collected:$('#c'+i).checked,status:$('#s'+i).value}});
 try{cur=await api('/api/customers/'+cur.id,{method:'PUT',body:b});draw();load();alert('Đã lưu')}catch(e){alert(e.message)}}
async function upload(i,el){if(!el.files.length)return;const fd=new FormData();fd.append('item',i);[...el.files].forEach(f=>fd.append('files',f));
 try{cur=await api('/api/customers/'+cur.id+'/files',{method:'POST',body:fd});draw();load()}catch(e){alert(e.message)}}
async function del(fid){if(confirm('Xóa file này?')){cur=await api(`/api/customers/${cur.id}/files/${fid}`,{method:'DELETE'});draw();load()}}
async function delC(){if(confirm('Xóa khách và toàn bộ file?')){await api('/api/customers/'+cur.id,{method:'DELETE'});cur=null;$('#main').innerHTML='';load()}}
async function users(){const u=await api('/api/users');$('#main').innerHTML=`<h2>Người dùng</h2><table>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.role}</td><td><button onclick="rmU('${x.username}')">Xóa</button></td></tr>`).join('')}</table><h3>Thêm / đổi mật khẩu</h3><div class="g"><input id="nu" placeholder="tài khoản"><input id="np" type="password" placeholder="mật khẩu ≥ 6"><select id="nr"><option value="sale">sale</option><option value="op">op (điều hành)</option><option value="visa">visa</option><option value="admin">admin</option></select><button class="p" onclick="addU()">Lưu user</button></div><p class="m">sale: thu mục A, B · op: thu mục C · visa: kiểm tra, kết luận, upload mọi mục · admin: toàn quyền.</p>`}
async function addU(){try{await api('/api/users',{method:'POST',body:{username:$('#nu').value,password:$('#np').value,role:$('#nr').value}});users()}catch(e){alert(e.message)}}
async function rmU(n){try{await api('/api/users/'+n,{method:'DELETE'});users()}catch(e){alert(e.message)}}
api('/api/me').then(m=>window.ITEMS=m.items).catch(()=>{}).finally(init);
</script></body></html>
