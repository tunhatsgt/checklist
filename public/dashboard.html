<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách đoàn</title><link rel="stylesheet" href="app.css"></head><body>
<div id="bar"></div><main><div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><div><h1>Danh sách đoàn</h1><div class="m">Chọn một đoàn để mở bảng hồ sơ chi tiết.</div></div><span class="sp"></span>
<button class="p" id="add" onclick="edit()" hidden>+ Đoàn mới</button><a class="btn" href="/api/export.csv">Xuất CSV</a><button id="ub" onclick="users()" hidden>Người dùng</button></div>
<div class="stats" id="stats"></div><div class="tools"><input id="q" placeholder="Tìm tên đoàn, trưởng đoàn, nước…" oninput="draw()"><select id="fl" onchange="draw()"><option value="">Tất cả</option><option value="ok">Đủ hồ sơ</option><option value="no">Thiếu / cần bổ sung</option><option value="wip">Đang xử lý</option></select></div>
<div class="grid" id="grid"></div></main>
<dialog id="dg"><form method="dialog" id="df" style="display:grid;gap:10px"><h3 id="dt" style="margin:0"></h3><label>Tên đoàn / khách<input name="name" required></label><label>Trưởng đoàn / liên hệ<input name="leader"></label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><label>Số khách<input name="pax" type="number" min="0"></label><label>Nước nộp<input name="country"></label><label>Ngày nộp<input name="date" type="date"></label></div><label>Ghi chú<textarea name="note" rows="2"></textarea></label><div style="display:flex;gap:8px"><button class="p" value="ok">Lưu</button><button value="x" formnovalidate>Hủy</button><span class="sp"></span><button type="button" id="dl" onclick="rm()" style="color:#b91c1c" hidden>Xóa đoàn</button></div></form></dialog>
<dialog id="ud"><h3 style="margin:0 0 10px">Người dùng</h3><div id="ul"></div><h4>Tạo tài khoản trực tiếp / đổi mật khẩu</h4><div style="display:grid;gap:8px"><input id="nu" placeholder="Tên tài khoản (a-z, 0-9, _)"><input id="np" type="password" placeholder="Mật khẩu ≥ 6 ký tự"><select id="nr"><option value="sale">sale</option><option value="op">op (điều hành)</option><option value="visa">visa</option><option value="admin">admin</option></select><div style="display:flex;gap:8px"><button class="p" onclick="addU()">Lưu</button><button onclick="$('#ud').close()">Đóng</button></div></div></dialog>
<script src="app.js"></script><script>
let L=[],eid=null;const stOf=c=>/^Đủ/.test(c.conclusion)?'ok':/^(Thiếu|Cần)/.test(c.conclusion)?'no':'wip';
(async()=>{await boot();$('#add').hidden=!edG();$('#ub').hidden=me.role!=='admin';if(me.role==='admin')pend();load()})();
async function load(){L=await api('/api/customers');draw()}
function draw(){const q=$('#q').value.toLowerCase(),f=$('#fl').value;const v=L.filter(c=>(!f||stOf(c)===f)&&(c.name+(c.leader||'')+c.country).toLowerCase().includes(q));
 $('#stats').innerHTML=[['Tổng số đoàn',L.length],['Đủ hồ sơ',L.filter(c=>stOf(c)==='ok').length],['Thiếu / bổ sung',L.filter(c=>stOf(c)==='no').length],['File đã upload',L.reduce((a,c)=>a+c.files,0)]].map(([a,b],i)=>`<div class="st" style="animation-delay:${i*60}ms"><b>${b}</b>${a}</div>`).join('');
 $('#grid').innerHTML=v.map((c,i)=>{const s=stOf(c);return`<div class="card" style="animation-delay:${i*40}ms" onclick="location.href='/group.html?id=${c.id}'"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:16px">${esc(c.name)}</b><span class="tag ${s}">${{ok:'Đủ',no:'Thiếu',wip:'Đang xử lý'}[s]}</span></div><div class="m">${esc(c.leader||'—')} · ${esc(c.pax||0)} khách · ${esc(c.country||'chưa chọn nước')}${c.date?' · nộp '+esc(c.date):''}</div><div class="bar"><i style="width:${c.done/23*100}%"></i></div><div class="m">Đủ ${c.done}/23 · Đã thu ${c.col}/23 · ${c.files} file</div>${edG()?`<div style="margin-top:10px"><button onclick="event.stopPropagation();edit('${c.id}')">Sửa thông tin</button></div>`:''}</div>`}).join('')||'<p class="m">Chưa có đoàn nào.</p>'}
async function edit(id){eid=id||null;const c=id?await api('/api/customers/'+id):{};const f=$('#df');$('#dt').textContent=id?'Sửa thông tin đoàn':'Tạo đoàn mới';
 for(const k of['name','leader','pax','country','date','note'])f[k].value=c[k]||'';$('#dl').hidden=!(id&&me.role==='admin');$('#dg').showModal()}
$('#dg').onclose=async()=>{const d=$('#dg');if(d.returnValue!=='ok')return;const f=$('#df'),b={};for(const k of['name','leader','pax','country','date','note'])b[k]=f[k].value;
 try{if(eid)await api('/api/customers/'+eid,{method:'PUT',body:b});else{const c=await api('/api/customers',{method:'POST',body:b});location.href='/group.html?id='+c.id;return}toast('Đã lưu');load()}catch(e){toast(e.message)}d.returnValue=''};
async function rm(){if(confirm('Xóa đoàn và toàn bộ file scan?')){await api('/api/customers/'+eid,{method:'DELETE'});$('#dg').close('x');load()}}
async function pend(){const n=(await api('/api/users')).filter(x=>x.pending).length;$('#ub').textContent='Người dùng'+(n?` (${n} chờ duyệt)`:'')}
async function users(){const u=await api('/api/users');$('#ul').innerHTML=u.map(x=>x.pending?`<div style="display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--bd);background:#fffbeb"><span style="flex:1">${esc(x.name)} <span class="m">(${esc(x.username)})</span> <span class="tag no">chờ duyệt</span></span><select id="ap_${esc(x.username)}" style="width:auto"><option value="sale">sale</option><option value="op">op</option><option value="visa">visa</option><option value="admin">admin</option></select><button class="p" onclick="appr('${esc(x.username)}')">Duyệt</button><button onclick="rmU('${esc(x.username)}')">Từ chối</button></div>`:`<div style="display:flex;gap:10px;padding:6px;border-bottom:1px solid var(--bd)"><span style="flex:1">${esc(x.name)} <span class="m">(${esc(x.username)})</span></span><span class="tag">${x.role}</span><button onclick="rmU('${esc(x.username)}')">Xóa</button></div>`).join('');$('#ud').showModal();pend()}
async function appr(n){try{await api('/api/users/'+encodeURIComponent(n)+'/approve',{method:'PUT',body:{role:document.getElementById('ap_'+n).value}});toast('Đã cấp quyền');users()}catch(e){toast(e.message)}}
async function addU(){try{await api('/api/users',{method:'POST',body:{username:$('#nu').value,password:$('#np').value,role:$('#nr').value}});$('#nu').value=$('#np').value='';users()}catch(e){toast(e.message)}}
async function rmU(n){try{await api('/api/users/'+encodeURIComponent(n),{method:'DELETE'});users()}catch(e){toast(e.message)}}
</script></body></html>
